aid: donut-media
name: Donut Media
description: >-
  Donut Media is an American automotive entertainment brand and one of the
  largest automotive channels on YouTube, founded in 2015 by Matt Levin, Ben
  Conrad, and Nick Moceri. It is best known for original series such as Up to
  Speed, Money Pit, and HiLow, along with the Past Gas podcast, reaching
  millions of car enthusiasts through video, social, and audio. Donut monetizes
  through advertising, brand sponsorships, content licensing, and an extensive
  Shopify-powered online store selling apparel, hats, and collectibles. The
  company was acquired by Recurrent Ventures in November 2021. This profile
  documents Donut Media's public web and commerce surface; the company does not
  publish a developer API program.
